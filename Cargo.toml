[package]
name = "gravrail"
version = "0.1.0"
edition = "2024"
description = "Deterministic geometric confinement for AI agents — Lie groups, gauge theory, group-native crypto"
license = "MIT OR Apache-2.0"

[[bin]]
name = "gravrail"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1", features = ["server", "transport-io", "transport-streamable-http-server"] }
axum = "0.8"
tokio-util = "0.7"
tokio = { version = "1", features = ["full"] }
nalgebra = "0.33"
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
anyhow = "1"
thiserror = "2"
rand = "0.8"
sha2 = "0.10"
dirs = "6"
reqwest = { version = "0.12", features = ["json", "stream"] }
hmac = "0.12"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "hot_path"
harness = false
